name: Windows foundation
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: TypeScript checks
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Windows sidecar
        run: |
          npm run desktop:prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native tests and installer build
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed runtime and uninstall
        timeout-minutes: 6
        run: node scripts/check-windows-installer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aluraya-installer-check
          path: evidence/local/installer-check.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: aluraya-native-lock-and-executable
          path: |
            src-tauri/Cargo.lock
            src-tauri/target/release/aluraya.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
